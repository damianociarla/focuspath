name: Bug report
description: Report an incorrect scan, crash, or report problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command and the behavior you expected.
    validations:
      required: true
  - type: input
    attributes:
      label: FocusPath version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Link to a public page or provide a minimal HTML fixture. Remove sensitive information.
    validations:
      required: true
