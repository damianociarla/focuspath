name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Check reporter performance against the versioned baseline
        env:
          REPORTER_METRICS_PATH: artifacts/reporter-performance.json
        run: |
          mkdir -p artifacts
          npm run reporter:memory
      - name: Preserve reporter performance history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporter-performance-${{ github.sha }}
          path: artifacts/reporter-performance.json
          retention-days: 90
      - run: npm run dev:check --workspace focuspath
      - run: npm run docs:check
      - run: npm run pack:check --workspace focuspath
      - run: npm run infra:check
      - run: npm audit --audit-level=high
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
      - name: Validate GitHub Actions workflows
        run: |
          "${RUNNER_TEMP}/actionlint"

  native-smoke:
    name: native-smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reporter:native

  native-compatibility:
    name: native-compatibility
    if: ${{ always() }}
    needs: native-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every native platform smoke test
        env:
          MATRIX_RESULT: ${{ needs.native-smoke.result }}
        run: test "${MATRIX_RESULT}" = "success"
