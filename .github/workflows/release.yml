name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to recover or retry
        required: true
        type: string
      allow_downgrade:
        description: Intentionally roll production back to an older tag
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: focuspath-production-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: env -u GITHUB_REF_NAME node scripts/check-release.mjs "${RELEASE_TAG}"
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run dev:check --workspace focuspath
      - run: npm run docs:check
      - run: npm run pack:check --workspace focuspath
      - run: npm run infra:check
      - name: Verify installable tarball
        run: |
          package_tarball="$(npm pack --workspace focuspath --json | node -e "let value='';process.stdin.on('data',chunk=>value+=chunk).on('end',()=>console.log(JSON.parse(value)[0].filename))")"
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" "./$package_tarball"
          "$install_dir/node_modules/.bin/focuspath" --help

  deploy-api:
    needs: validate
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_downgrade && 'production-rollback' || 'production' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Check whether the API already matches the release
        id: api-state
        env:
          API_URL: ${{ vars.VITE_API_URL }}
          ALLOW_DOWNGRADE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_downgrade || false }}
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(curl --fail --silent --show-error "${API_URL}/health" | node -e "let body='';process.stdin.on('data',chunk=>body+=chunk).on('end',()=>console.log(JSON.parse(body).version))" || true)"
          if [[ "${actual}" == "${expected}" ]]; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "API already reports ${expected}; skipping AWS deployment."
          elif [[ -n "${actual}" ]]; then
            ordering="$(node -e 'const values=process.argv.slice(1).map((value)=>{const match=/^(\d+)\.(\d+)\.(\d+)$/.exec(value);if(!match)throw new Error("Invalid release version: "+value);return match.slice(1).map(Number)});let result=0;for(let index=0;index<3;index+=1){if(values[0][index]!==values[1][index]){result=values[0][index]>values[1][index]?1:-1;break}}process.stdout.write(String(result))' "${actual}" "${expected}")"
            if [[ "${ordering}" == "1" && "${ALLOW_DOWNGRADE}" != "true" ]]; then
              echo "Refusing to downgrade production from ${actual} to ${expected}. Retry manually with allow_downgrade only for an intentional rollback." >&2
              exit 1
            fi
            if [[ "${ordering}" == "1" ]]; then
              echo "Approved rollback from ${actual} to ${expected} through the protected rollback environment."
            fi
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.api-state.outputs.deploy == 'true'
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Deploy or reuse immutable API image
        if: steps.api-state.outputs.deploy == 'true'
        env:
          AWS_REGION: eu-west-1
          FOCUSPATH_IMAGE_TAG: ${{ env.RELEASE_TAG }}
          FOCUSPATH_ORIGIN_VERIFY_TOKEN: ${{ secrets.FOCUSPATH_ORIGIN_VERIFY_TOKEN }}
          FOCUSPATH_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          FOCUSPATH_APPLICATION_ROLE_ARN: ${{ vars.AWS_APPLICATION_ROLE_ARN }}
        run: |
          : "${FOCUSPATH_APPLICATION_ROLE_ARN:?AWS_APPLICATION_ROLE_ARN is not configured}"
          ./infra/aws/deploy-app-runner.sh
      - name: Verify deployed engine version
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          expected="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            actual="$(curl --fail --silent --show-error "${API_URL}/health" | node -e "let body='';process.stdin.on('data',chunk=>body+=chunk).on('end',()=>console.log(JSON.parse(body).version))" || true)"
            if [[ "${actual}" == "${expected}" ]]; then exit 0; fi
            echo "Health check attempt ${attempt}/30 reported '${actual:-unavailable}', expected '${expected}'."
            sleep 10
          done
          echo "API did not report expected version ${expected}." >&2
          exit 1

  publish-npm:
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Publish or verify existing npm package
        run: |
          version="${RELEASE_TAG#v}"
          expected_commit="$(git rev-parse HEAD)"
          if npm view "focuspath@${version}" version >/dev/null 2>&1; then
            published_commit="$(npm view "focuspath@${version}" gitHead --json | tr -d '"')"
            if [[ "${published_commit}" != "${expected_commit}" ]]; then
              echo "focuspath@${version} exists for a different commit." >&2
              exit 1
            fi
            echo "focuspath@${version} already matches ${expected_commit}; skipping publish."
            exit 0
          fi
          npm publish --workspace focuspath

  deploy-site:
    needs: publish-npm
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @focuspath/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  github-release:
    needs: deploy-site
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}" --verify-tag --title "FocusPath ${RELEASE_TAG}" --generate-notes
          fi
