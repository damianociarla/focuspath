openapi: 3.1.0
info:
  title: FocusPath Live Scanner API
  version: 0.4.4
  description: Rate-limited public demo API; not a general-purpose scanning service.
paths:
  /health:
    get:
      summary: Check service readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, version, activeScans]
                properties:
                  status: { const: ok }
                  version: { type: string }
                  activeScans: { type: integer, minimum: 0 }
  /v1/scans:
    post:
      summary: Scan one public web page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2048
                  description: Absolute HTTP(S) URL or hostname; omitted schemes default to HTTPS.
                  examples: ["https://example.com", "example.com"]
      responses:
        "200":
          description: Scan completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/Retryable" }
        "502": { $ref: "#/components/responses/ScanFailed" }
        "503": { $ref: "#/components/responses/Retryable" }
        "504": { $ref: "#/components/responses/ScanFailed" }
components:
  schemas:
    ScanResponse:
      type: object
      additionalProperties: false
      required: [url, title, scannedAt, durationMs, engineVersion, direction, tabPressCount, limits, stoppedBecause, steps, issues, reportHtml]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        scannedAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
        engineVersion: { type: string }
        direction: { type: string, enum: [forward, reverse] }
        tabPressCount: { type: integer, minimum: 0 }
        limits: { $ref: "#/components/schemas/TraversalLimits" }
        stoppedBecause: { $ref: "#/components/schemas/StopReason" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/FocusStep" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/FocusIssue" }
        reportHtml: { type: string }
    StopReason:
      type: string
      enum: [cycle-complete, step-limit, tab-press-limit, opaque-host-limit, no-focusable-elements, document-exhausted, stalled-on-element]
    TraversalLimits:
      type: object
      additionalProperties: false
      required: [maxSteps, maxTabPresses, maxOpaqueTabPresses]
      properties:
        maxSteps: { type: integer, minimum: 1 }
        maxTabPresses: { type: integer, minimum: 1 }
        maxOpaqueTabPresses: { type: integer, minimum: 1 }
    FocusStep:
      type: object
      additionalProperties: false
      required: [index, selector, tagName, role, accessibleName, tabIndex, href, rect, focusIndicator]
      properties:
        index: { type: integer, minimum: 1 }
        selector: { type: string }
        tagName: { type: string }
        role: { type: [string, "null"] }
        accessibleName: { type: string, maxLength: 160 }
        tabIndex: { type: integer }
        href: { type: [string, "null"], format: uri }
        rect: { $ref: "#/components/schemas/Rect" }
        observedRect:
          description: Geometry when traversal reached the element, before the page is reset for the final screenshot.
          $ref: "#/components/schemas/Rect"
        quad:
          type: array
          description: Four final border-box points in screenshot coordinates, preserving CSS transforms.
          minItems: 8
          maxItems: 8
          items: { type: number }
        visualEvidence: { $ref: "#/components/schemas/VisualEvidence" }
        focusIndicator: { $ref: "#/components/schemas/FocusStyles" }
        scrollContexts:
          type: array
          description: Every nested element scroller or same-origin iframe viewport that makes this step sequence-only.
          items: { $ref: "#/components/schemas/ScrollContext" }
        scrollContext:
          deprecated: true
          description: First scroll context, retained for compatibility with v0.4.1. Use scrollContexts.
          $ref: "#/components/schemas/ScrollContext"
    Rect:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, minimum: 0 }
        height: { type: number, minimum: 0 }
    FocusStyles:
      type: object
      additionalProperties: false
      required: [outline, boxShadow]
      properties:
        outline: { type: string }
        boxShadow: { type: string }
    VisualEvidence:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [plotted, partially-visible, outside-capture, sequence-only]
        reason:
          type: string
          enum: [scroll-or-clipping-context, geometry-unavailable]
    ScrollContext:
      type: object
      additionalProperties: false
      required: [selector, scrollLeft, scrollTop]
      properties:
        kind: { type: string, enum: [element, viewport], default: element }
        selector: { type: string }
        scrollLeft: { type: number }
        scrollTop: { type: number }
    FocusIssue:
      type: object
      additionalProperties: false
      required: [kind, severity, step, selector, message]
      properties:
        kind:
          type: string
          enum: [missing-name, missing-or-generic-role, positive-tabindex, focus-stalled, opaque-focus-host, opaque-host-limit]
        severity: { type: string, enum: [error, warning] }
        step: { type: integer, minimum: 1 }
        selector: { type: string }
        message: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid JSON or unsafe URL
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Browser origin is not allowed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedMediaType:
      description: Request must use application/json
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Retryable:
      description: Rate or concurrency limit reached; inspect Retry-After
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds before retrying }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ScanFailed:
      description: Target navigation or scan failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
