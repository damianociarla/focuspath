AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub OIDC entry role and CloudFormation execution role for FocusPath releases

Parameters:
  GitHubOwner:
    Type: String
    Default: damianociarla
  GitHubRepository:
    Type: String
    Default: focuspath
  GitHubOwnerId:
    Type: String
    Default: "2201712"
    Description: Immutable GitHub account ID used in OIDC subject claims
  GitHubRepositoryId:
    Type: String
    Default: "1341119918"
    Description: Immutable GitHub repository ID used in OIDC subject claims
  CloudFrontDistributionId:
    Type: String
    Default: E15U2KW2I7KDLT
    Description: Existing FocusPath distribution managed by the application stack
  CloudFrontOriginRequestPolicyId:
    Type: String
    Default: 839342e7-4826-4313-9fb5-0d3b5295bbc5
    Description: Existing FocusPath origin request policy managed by the application stack
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Reuse an account-level GitHub Actions OIDC provider when one already exists

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  FocusPathApplicationRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: focuspath-application-role-boundary
      Description: Maximum permissions available to FocusPath application service roles
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Effect: Allow
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:DescribeImages
              - ecr:BatchCheckLayerAvailability
            Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/focuspath-api"

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FocusPathInfrastructure
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/focuspath-api-apprunner-ecr-access"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref FocusPathApplicationRoleBoundary
              - Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePermissionsBoundary
                  - iam:DeleteRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/focuspath-api-apprunner-ecr-access"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/focuspath-api-apprunner-ecr-access"
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/apprunner.amazonaws.com/AWSServiceRoleForAppRunner"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: apprunner.amazonaws.com
              - Effect: Allow
                Action:
                  - apprunner:CreateService
                  - apprunner:DeleteService
                  - apprunner:DescribeService
                  - apprunner:UpdateService
                  - apprunner:ListOperations
                  - apprunner:CreateAutoScalingConfiguration
                  - apprunner:DeleteAutoScalingConfiguration
                  - apprunner:DescribeAutoScalingConfiguration
                  - apprunner:ListAssociatedServicesForAutoScalingConfiguration
                  - apprunner:ListTagsForResource
                  - apprunner:TagResource
                  - apprunner:UntagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:apprunner:${AWS::Region}:${AWS::AccountId}:service/focuspath-api/*"
                  - !Sub "arn:${AWS::Partition}:apprunner:${AWS::Region}:${AWS::AccountId}:autoscalingconfiguration/focuspath-cost-cap/*"
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateOriginRequestPolicy
                  - cloudfront:ListDistributions
                  - cloudfront:ListOriginRequestPolicies
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateDistribution
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
              - Effect: Allow
                Action:
                  - cloudfront:DeleteOriginRequestPolicy
                  - cloudfront:GetOriginRequestPolicy
                  - cloudfront:GetOriginRequestPolicyConfig
                  - cloudfront:UpdateOriginRequestPolicy
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-request-policy/${CloudFrontOriginRequestPolicyId}"
              - Effect: Allow
                Action:
                  - budgets:ModifyBudget
                  - budgets:ViewBudget
                Resource: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/focuspath-monthly-cost"

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/tags/v*"
      Policies:
        - PolicyName: FocusPathReleaseDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:DescribeRepositories
                  - ecr:CreateRepository
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:DescribeImages
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/focuspath-api"
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/focuspath-api/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
