AWSTemplateFormatVersion: "2010-09-09"
Description: FocusPath live scanner API on AWS App Runner

Parameters:
  ImageIdentifier:
    Type: String
    Description: Full private ECR image identifier including tag
  AllowedOrigin:
    Type: String
    Default: https://damianociarla.github.io

Resources:
  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  ApiService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: focuspath-api
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: ALLOWED_ORIGINS
                Value: !Ref AllowedOrigin
              - Name: MAX_CONCURRENT_SCANS
                Value: "2"
              - Name: MAX_FOCUS_STEPS
                Value: "50"
              - Name: SCAN_TIMEOUT_MS
                Value: "25000"
              - Name: RATE_LIMIT_PER_10_MINUTES
                Value: "4"
      InstanceConfiguration:
        Cpu: "1 vCPU"
        Memory: "2 GB"
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  ServiceUrl:
    Description: HTTPS URL of the FocusPath API
    Value: !Sub "https://${ApiService.ServiceUrl}"
  ServiceArn:
    Description: ARN used to associate AWS WAF later
    Value: !GetAtt ApiService.ServiceArn
