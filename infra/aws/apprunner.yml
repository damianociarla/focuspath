AWSTemplateFormatVersion: "2010-09-09"
Description: FocusPath live scanner API on AWS App Runner

Parameters:
  ImageIdentifier:
    Type: String
    Description: Full private ECR image identifier including tag
  AllowedOrigin:
    Type: String
    Default: https://damianociarla.github.io
  OriginVerifyToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret header shared by CloudFront and App Runner
  BudgetAlertEmail:
    Type: String
    Default: ""
    Description: Optional email address for monthly cost alerts
  MonthlyBudgetUsd:
    Type: Number
    Default: 20
    MinValue: 1
  WebAclArn:
    Type: String
    Default: ""
    Description: Optional global WAFv2 web ACL ARN for the CloudFront distribution

Conditions:
  HasBudgetAlertEmail: !Not [!Equals [!Ref BudgetAlertEmail, ""]]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Resources:
  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/focuspath-application-role-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FocusPathEcrRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/focuspath-api"
      Tags:
        - Key: Project
          Value: FocusPath

  ApiAutoScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: focuspath-cost-cap
      MaxConcurrency: 10
      MaxSize: 1
      MinSize: 1
      Tags:
        - Key: Project
          Value: FocusPath

  ApiService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: focuspath-api
      AutoScalingConfigurationArn: !GetAtt ApiAutoScaling.AutoScalingConfigurationArn
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: ALLOWED_ORIGINS
                Value: !Ref AllowedOrigin
              - Name: ORIGIN_VERIFY_TOKEN
                Value: !Ref OriginVerifyToken
              - Name: MAX_CONCURRENT_SCANS
                Value: "1"
              - Name: MAX_FOCUS_STEPS
                Value: "50"
              - Name: MAX_TAB_PRESSES
                Value: "200"
              - Name: MAX_OPAQUE_TAB_PRESSES
                Value: "100"
              - Name: SCAN_TIMEOUT_MS
                Value: "25000"
              - Name: RATE_LIMIT_PER_10_MINUTES
                Value: "4"
              - Name: GLOBAL_RATE_LIMIT_PER_HOUR
                Value: "60"
              - Name: TARGET_RATE_LIMIT_PER_HOUR
                Value: "2"
      InstanceConfiguration:
        Cpu: "1 vCPU"
        Memory: "2 GB"
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      Tags:
        - Key: Project
          Value: FocusPath

  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Project
          Value: FocusPath
      DistributionConfig:
        Comment: Protected public entry point for the FocusPath API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: AppRunnerOrigin
            DomainName: !GetAtt ApiService.ServiceUrl
            OriginCustomHeaders:
              - HeaderName: X-FocusPath-Origin-Verify
                HeaderValue: !Ref OriginVerifyToken
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: AppRunnerOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: focuspath-api-origin-headers
        Comment: Forward only the headers required by the public scanner API
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
            - CloudFront-Viewer-Address
            - Content-Type
            - Origin

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetAlertEmail
    Properties:
      Budget:
        BudgetName: focuspath-monthly-cost
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL

Outputs:
  ServiceUrl:
    Description: Direct App Runner URL; scan requests require the private origin header
    Value: !Sub "https://${ApiService.ServiceUrl}"
  ServiceArn:
    Description: ARN used to associate AWS WAF later
    Value: !GetAtt ApiService.ServiceArn
  ProtectedApiUrl:
    Description: Public API URL to configure in GitHub Pages
    Value: !Sub "https://${ApiDistribution.DomainName}"
  DistributionId:
    Description: CloudFront distribution to enroll in the Free flat-rate plan
    Value: !Ref ApiDistribution
